plugins {
    id 'java'
    id 'base'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

allprojects {
    apply plugin: 'java'

    group = "com.lauriethefish.betterportals"

    // Optional, just for showing name
    afterEvaluate {
        println("Evaluating project ${project.group}:${project.name}:${version}")
    }

    test {
        useJUnitPlatform()
    }

    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    compileJava.options.encoding = 'UTF-8'

    dependencies {
        implementation 'com.google.inject:guice:5.1.0'
        implementation 'com.google.inject.extensions:guice-assistedinject:5.1.0'
        implementation 'org.jetbrains:annotations:24.0.1'
        implementation 'com.google.code.findbugs:jsr305:3.0.2'

        compileOnly 'org.projectlombok:lombok:1.18.30'
        testImplementation 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    }

    tasks {
        compileJava {
            options.release.set(21)
        }
    }
}

jar.enabled = false
build.enabled = false

subprojects {
    if (System.getenv('BP_DEVELOPER_BUILD') == '1') {
        version = gradle.ext.versionName + '-' + "git rev-parse --verify --short HEAD".execute().text.trim().toLowerCase()
    } else {
        version = gradle.ext.versionName
    }

    base {
        archivesName = "${rootProject.name}-${project.name}"
    }
}

/*
 Keep runServer configuration inside the tasks { } block — that's correct.
 But configuration that references tasks.named(...) must be at project scope, not nested inside tasks{}.
*/
tasks {
    runServer {
        downloadPlugins {
            github("dmulloy2", "ProtocolLib", "5.4.0", "ProtocolLib.jar")
        }
        minecraftVersion("1.21.8")
        runPaper.disablePluginJarDetection()

        pluginJars.from(subprojects.collect {
            if  (it.name == "final") {
                return it.projectDir.toPath().resolve("build/libs").resolve("${rootProject.name}-${it.name}-${it.version}-all.jar").toFile()
            } else {
                return null
            }
        })
    }
}

// Ensure runServer runs only after all projects have been compiled / assembled.
// Use task path strings to avoid forcing task realization during configuration.
tasks.named('runServer') {
    dependsOn subprojects.collect { "${it.path}:assemble" }
    dependsOn subprojects.collect { "${it.path}:classes" }
}
